<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>10x10 Word Search Puzzle</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: #121212;
      color: #ffffff;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      margin: 0;
      padding: 16px 10px 30px;
      min-height: 100vh;
      box-sizing: border-box;
      overflow-x: hidden;
    }

    h2 {
      margin: 0 0 10px 0;
      color: #f1f2f6;
      letter-spacing: 1px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 14px;
    }

    .timer-badge {
      background: #1e1e24;
      padding: 7px 14px;
      border-radius: 8px;
      border: 1px solid #333;
      font-size: 14px;
      font-weight: 600;
      color: #00d2d3;
    }

    .reset-btn {
      background-color: #ff4757;
      color: white;
      border: none;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(255, 71, 87, 0.3);
      transition: background 0.2s, transform 0.1s;
    }
    .reset-btn:active { transform: scale(0.95); }

    .word-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 16px;
      max-width: 360px;
    }
    .word-list span {
      padding: 4px 9px;
      background: #23272a;
      border: 1px solid #3a3f47;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      color: #c8d6e5;
      transition: all 0.2s ease;
    }
    .word-list span.found {
      text-decoration: line-through;
      background: #10ac84;
      border-color: #10ac84;
      color: #ffffff;
      transform: scale(0.96);
    }

    .grid-container {
      position: relative;
      background: #1e1e24;
      padding: 16px;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      border: 1px solid #2f3542;
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(10, 30px);
      grid-template-rows: repeat(10, 30px);
      gap: 3px;
    }

    .cell {
      width: 30px;
      height: 30px;
      background: #2f3542;
      color: #f1f2f6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.1s ease;
    }
    .cell.selected {
      background: #ffa502;
      color: #000;
    }
    .cell.found {
      background: #10ac84;
      color: white;
    }

    /* పదం దొరికినప్పుడు వచ్చే ఫ్లోటింగ్ అభినందన టెక్స్ట్ */
    .toast-popup {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.6);
      background: rgba(16, 172, 132, 0.95);
      color: #ffffff;
      font-size: 18px;
      font-weight: 800;
      padding: 10px 20px;
      border-radius: 20px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
      pointer-events: none;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 50;
      white-space: nowrap;
    }
    .toast-popup.show {
      opacity: 1;
      transform: translate(-50%, -60%) scale(1.1);
    }

    /* బెస్ట్ స్కోర్ కార్డ్ */
    .best-score-card {
      margin-top: 18px;
      background: linear-gradient(135deg, #242b35 0%, #171b21 100%);
      border: 1.5px solid #f39c12;
      padding: 10px 20px;
      border-radius: 10px;
      box-shadow: 0 4px 14px rgba(243, 156, 18, 0.25);
      text-align: center;
      transition: transform 0.3s ease;
    }
    .best-score-text {
      color: #f1c40f;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    /* కాన్ఫెట్టి కాన్వాస్ (సెలబ్రేషన్ కోసం) */
    #confettiCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 999;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-box {
      background: #1e1e24;
      padding: 26px 20px;
      border-radius: 14px;
      text-align: center;
      border: 1.5px solid #10ac84;
      box-shadow: 0 10px 28px rgba(0,0,0,0.8);
      max-width: 310px;
      width: 85%;
    }
    .modal-box.record-breaker {
      border-color: #f1c40f;
      animation: recordGlow 1.5s infinite alternate;
    }
    @keyframes recordGlow {
      from { box-shadow: 0 0 15px rgba(241, 196, 15, 0.3); }
      to { box-shadow: 0 0 30px rgba(241, 196, 15, 0.8); }
    }
    .modal-box h3 { margin: 0 0 10px 0; font-size: 22px; }
    .modal-box p { margin: 0 0 18px 0; color: #c8d6e5; font-size: 14px; line-height: 1.5; }
    .modal-btn {
      background: #10ac84;
      color: white;
      border: none;
      padding: 9px 22px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <h2>Word Search (10x10)</h2>

  <div class="top-bar">
    <div class="timer-badge">⏱️ Time: <span id="timer">00:00</span></div>
    <button class="reset-btn" id="resetBtn">🔄 New Game</button>
  </div>

  <div class="word-list" id="wordList"></div>

  <div class="grid-container">
    <div id="grid"></div>
    <div class="toast-popup" id="toast">Awesome!</div>
  </div>

  <div class="best-score-card" id="bestCard">
    <span class="best-score-text" id="bestScoreText">Best Speed --:-- of 0 Attempts</span>
  </div>

  <div class="modal-overlay" id="resultModal">
    <div class="modal-box" id="modalBox">
      <h3 id="modalTitle">🎉 Round Cleared!</h3>
      <p id="modalMessage"></p>
      <button class="modal-btn" id="modalActionBtn">Next Round</button>
    </div>
  </div>

  <canvas id="confettiCanvas"></canvas>

  <script>
    const GRID_SIZE = 10;
    const WORDS_COUNT = 5;

    const MASTER_WORDS = [
      "CAT", "SUN", "MOON", "MARS",
      "APPLE", "TIGER", "SOLAR", "ROBOT", "EARTH", 
      "PLANET", "ROCKET", "GALAXY", "STREAM", 
      "CRICKET", "NETWORK", "COMPASS", "UNIVERSE"
    ];

    const PRAISES = [
      "🌟 Brilliant!", 
      "🎯 Spot On!", 
      "🔥 Awesome!", 
      "👏 Excellent!", 
      "⚡ Super Fast!"
    ];

    let totalAttempts = 0;
    let bestTimeSeconds = null;

    let activeWords = [];
    let grid = [];
    let isSelecting = false;
    let startCell = null;
    let selectedCells = [];
    const foundWords = new Set();

    let timerInterval = null;
    let elapsedSeconds = 0;
    let isGameOver = false;

    const gridEl = document.getElementById("grid");
    const wordListEl = document.getElementById("wordList");
    const resetBtn = document.getElementById("resetBtn");
    const timerEl = document.getElementById("timer");
    const bestScoreText = document.getElementById("bestScoreText");
    const toast = document.getElementById("toast");
    const resultModal = document.getElementById("resultModal");
    const modalBox = document.getElementById("modalBox");
    const modalTitle = document.getElementById("modalTitle");
    const modalMessage = document.getElementById("modalMessage");
    const modalActionBtn = document.getElementById("modalActionBtn");
    const canvas = document.getElementById("confettiCanvas");
    const ctx = canvas.getContext("2d");

    const DIRECTIONS = [
      { dr: 0,  dc: 1  },
      { dr: 1,  dc: 0  },
      { dr: 1,  dc: 1  },
      { dr: 1,  dc: -1 },
      { dr: 0,  dc: -1 },
      { dr: -1, dc: 0  },
      { dr: -1, dc: 1  },
      { dr: -1, dc: -1 }
    ];

    // పదం దొరికినప్పుడు ఫ్లోటింగ్ అభినందనను చూపించడం
    function showPraiseToast() {
      const phrase = PRAISES[Math.floor(Math.random() * PRAISES.length)];
      toast.textContent = phrase;
      toast.classList.add("show");
      setTimeout(() => {
        toast.classList.remove("show");
      }, 900);
    }

    // కాన్ఫెట్టి సెలబ్రేషన్ యానిమేషన్
    let particles = [];
    let animationFrameId = null;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function triggerConfetti() {
      particles = [];
      const colors = ['#f1c40f', '#e74c3c', '#2ecc71', '#3498db', '#9b59b6', '#e67e22'];
      for (let i = 0; i < 140; i++) {
        particles.push({
          x: canvas.width / 2,
          y: canvas.height / 2,
          r: Math.random() * 5 + 3,
          dx: (Math.random() - 0.5) * 14,
          dy: (Math.random() - 0.5) * 14 - 3,
          color: colors[Math.floor(Math.random() * colors.length)],
          tilt: Math.random() * 10,
          tiltAngle: 0,
          tiltAngleInc: Math.random() * 0.08 + 0.04
        });
      }

      cancelAnimationFrame(animationFrameId);
      renderConfetti();
    }

    function renderConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      let stillActive = false;

      particles.forEach(p => {
        p.x += p.dx;
        p.y += p.dy;
        p.dy += 0.25; // Gravity
        p.tiltAngle += p.tiltAngleInc;
        p.tilt = Math.sin(p.tiltAngle) * 10;

        if (p.y < canvas.height) stillActive = true;

        ctx.beginPath();
        ctx.lineWidth = p.r;
        ctx.strokeStyle = p.color;
        ctx.moveTo(p.x + p.tilt + p.r, p.y);
        ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r);
        ctx.stroke();
      });

      if (stillActive) {
        animationFrameId = requestAnimationFrame(renderConfetti);
      } else {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }

    function formatTime(seconds) {
      const mins = String(Math.floor(seconds / 60)).padStart(2, '0');
      const secs = String(seconds % 60).padStart(2, '0');
      return `${mins}:${secs}`;
    }

    function startTimer() {
      clearInterval(timerInterval);
      elapsedSeconds = 0;
      timerEl.textContent = "00:00";
      timerInterval = setInterval(() => {
        elapsedSeconds++;
        timerEl.textContent = formatTime(elapsedSeconds);
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timerInterval);
    }

    function updateBestScoreUI() {
      if (bestTimeSeconds !== null) {
        bestScoreText.textContent = `Best Speed ${formatTime(bestTimeSeconds)} of ${totalAttempts} Attempts`;
      } else {
        bestScoreText.textContent = `Best Speed --:-- of ${totalAttempts} Attempts`;
      }
    }

    function pickRandomWords() {
      const eligible = MASTER_WORDS.filter(w => w.length <= GRID_SIZE);
      const shuffled = [...eligible].sort(() => 0.5 - Math.random());
      activeWords = shuffled.slice(0, WORDS_COUNT);
    }

    function placeWords() {
      grid = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(''));

      activeWords.forEach(word => {
        let placed = false;
        let attempts = 0;

        while (!placed && attempts < 400) {
          attempts++;
          const dir = DIRECTIONS[Math.floor(Math.random() * DIRECTIONS.length)];
          const r = Math.floor(Math.random() * GRID_SIZE);
          const c = Math.floor(Math.random() * GRID_SIZE);

          const endR = r + dir.dr * (word.length - 1);
          const endC = c + dir.dc * (word.length - 1);

          if (endR >= 0 && endR < GRID_SIZE && endC >= 0 && endC < GRID_SIZE) {
            let canPlace = true;
            for (let i = 0; i < word.length; i++) {
              const curR = r + dir.dr * i;
              const curC = c + dir.dc * i;
              if (grid[curR][curC] !== '' && grid[curR][curC] !== word[i]) {
                canPlace = false;
                break;
              }
            }

            if (canPlace) {
              for (let i = 0; i < word.length; i++) {
                grid[r + dir.dr * i][c + dir.dc * i] = word[i];
              }
              placed = true;
            }
          }
        }
      });

      const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          if (grid[r][c] === '') {
            grid[r][c] = letters[Math.floor(Math.random() * letters.length)];
          }
        }
      }
    }

    function renderUI() {
      gridEl.innerHTML = '';
      wordListEl.innerHTML = '';

      activeWords.forEach(w => {
        const span = document.createElement("span");
        span.id = `word-${w}`;
        span.textContent = w;
        wordListEl.appendChild(span);
      });

      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          const cell = document.createElement("div");
          cell.className = "cell";
          cell.textContent = grid[r][c];
          cell.dataset.r = r;
          cell.dataset.c = c;
          gridEl.appendChild(cell);
        }
      }
    }

    function startNewRound() {
      resultModal.style.display = "none";
      modalBox.classList.remove("record-breaker");
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      isGameOver = false;
      foundWords.clear();
      selectedCells = [];
      isSelecting = false;
      startCell = null;

      pickRandomWords();
      placeWords();
      renderUI();
      startTimer();
    }

    function getCell(r, c) {
      return document.querySelector(`.cell[data-r='${r}'][data-c='${c}']`);
    }

    function getCellFromPoint(x, y) {
      const el = document.elementFromPoint(x, y);
      return el && el.classList.contains("cell") ? el : null;
    }

    function startSelection(cell) {
      if (!cell || isGameOver) return;
      isSelecting = true;
      startCell = cell;
      highlightLine(cell);
    }

    function updateSelection(cell) {
      if (!isSelecting || !cell || !startCell || isGameOver) return;
      highlightLine(cell);
    }

    function highlightLine(endCell) {
      selectedCells.forEach(c => c.classList.remove("selected"));
      selectedCells = [];

      const r1 = parseInt(startCell.dataset.r);
      const c1 = parseInt(startCell.dataset.c);
      const r2 = parseInt(endCell.dataset.r);
      const c2 = parseInt(endCell.dataset.c);

      const dr = r2 - r1;
      const dc = c2 - c1;

      const isHorizontal = dr === 0 && dc !== 0;
      const isVertical = dc === 0 && dr !== 0;
      const isDiagonal = Math.abs(dr) === Math.abs(dc) && dr !== 0;

      if (r1 === r2 && c1 === c2) {
        selectedCells = [startCell];
      } else if (isHorizontal || isVertical || isDiagonal) {
        const stepR = dr === 0 ? 0 : dr / Math.abs(dr);
        const stepC = dc === 0 ? 0 : dc / Math.abs(dc);
        const steps = Math.max(Math.abs(dr), Math.abs(dc));

        for (let i = 0; i <= steps; i++) {
          const curCell = getCell(r1 + stepR * i, c1 + stepC * i);
          if (curCell) selectedCells.push(curCell);
        }
      } else {
        selectedCells = [startCell];
      }

      selectedCells.forEach(c => c.classList.add("selected"));
    }

    function endSelection() {
      if (!isSelecting || isGameOver) return;
      isSelecting = false;

      const currentWord = selectedCells.map(c => c.textContent).join("");
      const reversedWord = selectedCells.map(c => c.textContent).reverse().join("");

      const matched = activeWords.find(w => w === currentWord || w === reversedWord);

      if (matched && !foundWords.has(matched)) {
        foundWords.add(matched);
        selectedCells.forEach(c => {
          c.classList.remove("selected");
          c.classList.add("found");
        });
        document.getElementById(`word-${matched}`).classList.add("found");

        // సరైన పదం దొరికినప్పుడు అభినందన మెసేజ్
        showPraiseToast();

        // రౌండ్ లోని అన్ని పదాలు పూర్తయినప్పుడు
        if (foundWords.size === activeWords.length) {
          handleGameWon();
        }
      } else {
        selectedCells.forEach(c => c.classList.remove("selected"));
      }

      selectedCells = [];
      startCell = null;
    }

    function handleGameWon() {
      stopTimer();
      isGameOver = true;
      totalAttempts++;

      const isNewRecord = (bestTimeSeconds !== null && elapsedSeconds < bestTimeSeconds);
      const isFirstAttempt = (bestTimeSeconds === null);

      if (isFirstAttempt || isNewRecord) {
        bestTimeSeconds = elapsedSeconds;
      }

      updateBestScoreUI();

      setTimeout(() => {
        if (isNewRecord) {
          // మునుపటి రికార్డు సమయాన్ని బ్రేక్ చేసినప్పుడు సెలబ్రేషన్
          triggerConfetti();
          modalBox.classList.add("record-breaker");
          modalTitle.textContent = "⚡ NEW RECORD!";
          modalMessage.innerHTML = `Unbelievable! You broke your previous best record!<br><br>New Best Time: <b>${formatTime(elapsedSeconds)}</b>`;
        } else {
          modalBox.classList.remove("record-breaker");
          modalTitle.textContent = "🎉 Round Cleared!";
          modalMessage.innerHTML = `Completed in <b>${formatTime(elapsedSeconds)}</b>.`;
        }

        resultModal.style.display = "flex";
      }, 350);
    }

    // టచ్ మరియు మౌస్ ఈవెంట్లు
    gridEl.addEventListener("touchstart", (e) => {
      const t = e.touches[0];
      startSelection(getCellFromPoint(t.clientX, t.clientY));
    });

    window.addEventListener("touchmove", (e) => {
      if (!isSelecting) return;
      const t = e.touches[0];
      updateSelection(getCellFromPoint(t.clientX, t.clientY));
    });

    window.addEventListener("touchend", endSelection);

    gridEl.addEventListener("mousedown", (e) => startSelection(e.target));
    gridEl.addEventListener("mousemove", (e) => {
      if (isSelecting) updateSelection(e.target);
    });
    window.addEventListener("mouseup", endSelection);

    resetBtn.addEventListener("click", startNewRound);
    modalActionBtn.addEventListener("click", startNewRound);

    updateBestScoreUI();
    startNewRound();
  </script>
</body>
</html>
