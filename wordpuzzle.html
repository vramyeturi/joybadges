<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>10x10 Word Search Puzzle (Dark Theme)</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: #121212; /* బ్లాక్ థీమ్ బ్యాక్‌గ్రౌండ్ */
      color: #ffffff;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      margin: 0;
      padding: 20px 10px;
      min-height: 100vh;
      box-sizing: border-box;
    }

    h2 {
      margin: 0 0 10px 0;
      color: #f1f2f6;
      letter-spacing: 1px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 15px;
    }

    .timer-box {
      font-size: 16px;
      font-weight: bold;
      background: #1e1e1e;
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid #333;
      color: #00d2d3;
    }

    .reset-btn {
      background-color: #ff4757;
      color: white;
      border: none;
      padding: 9px 18px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(255, 71, 87, 0.3);
      transition: background 0.2s, transform 0.1s;
    }
    .reset-btn:active {
      transform: scale(0.95);
    }

    .word-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 20px;
      max-width: 360px;
    }
    .word-list span {
      padding: 5px 10px;
      background: #23272a;
      border: 1px solid #3a3f47;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
      color: #c8d6e5;
      transition: all 0.3s ease;
    }
    .word-list span.found {
      text-decoration: line-through;
      background: #10ac84;
      border-color: #10ac84;
      color: #ffffff;
      transform: scale(0.96);
    }

    /* టేబుల్ చుట్టూ స్పేసింగ్ & ప్యాడింగ్ */
    .grid-container {
      background: #1e1e24;
      padding: 16px;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      border: 1px solid #2f3542;
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(10, 30px);
      grid-template-rows: repeat(10, 30px);
      gap: 3px;
    }

    .cell {
      width: 30px;
      height: 30px;
      background: #2f3542;
      color: #f1f2f6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.1s ease;
    }
    .cell.selected {
      background: #ffa502; /* డ్రాగ్ చేసినప్పుడు గోల్డ్ / ఆరెంజ్ రంగు */
      color: #000;
    }
    .cell.found {
      background: #10ac84; /* దొరికిన పదాలకు ఆకుపచ్చ రంగు */
      color: #ffffff;
    }

    /* విన్ పాపప్ అలర్ట్ */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal-box {
      background: #1e1e24;
      padding: 24px;
      border-radius: 12px;
      text-align: center;
      border: 1px solid #10ac84;
      box-shadow: 0 10px 25px rgba(0,0,0,0.8);
      max-width: 280px;
    }
    .modal-box h3 {
      margin: 0 0 10px 0;
      color: #10ac84;
      font-size: 22px;
    }
    .modal-box p {
      margin: 0 0 18px 0;
      color: #c8d6e5;
      font-size: 14px;
    }
    .modal-btn {
      background: #10ac84;
      color: white;
      border: none;
      padding: 8px 18px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h2>Word Search (10x10)</h2>

  <div class="top-bar">
    <div class="timer-box">⏱️ <span id="timer">00:00</span></div>
    <button class="reset-btn" id="resetBtn">🔄 New Game</button>
  </div>

  <div class="word-list" id="wordList"></div>

  <div class="grid-container">
    <div id="grid"></div>
  </div>

  <div class="modal-overlay" id="winModal">
    <div class="modal-box">
      <h3>🎉 You Win!</h3>
      <p id="winMessage">అన్ని పదాలను కనుగొన్నారు!</p>
      <button class="modal-btn" id="playAgainBtn">మళ్లీ ఆడండి</button>
    </div>
  </div>

  <script>
    const GRID_SIZE = 10;
    
    // పెద్ద వర్డ్ బ్యాంక్ - రీసెట్ చేసిన ప్రతిసారీ ఇందులోంచి రాండమ్‌గా 5 పదాలు ఎంపికవుతాయి
    const MASTER_WORDS = [
      "TIGER", "MANGO", "SOLAR", "ROBOT", "EARTH", 
      "SPACE", "CLOUD", "WATER", "GREEN", "SMART", 
      "BRAIN", "POWER", "LIGHT", "STORM", "PLANT",
      "ORANGE", "ELEPHANT"
    ];
    const WORDS_COUNT = 5;

    let activeWords = [];
    let grid = [];
    let isSelecting = false;
    let startCell = null;
    let selectedCells = [];
    const foundWords = new Set();

    let timerInterval = null;
    let secondsElapsed = 0;

    const gridEl = document.getElementById("grid");
    const wordListEl = document.getElementById("wordList");
    const resetBtn = document.getElementById("resetBtn");
    const timerEl = document.getElementById("timer");
    const winModal = document.getElementById("winModal");
    const winMessage = document.getElementById("winMessage");
    const playAgainBtn = document.getElementById("playAgainBtn");

    const DIRECTIONS = [
      { dr: 0,  dc: 1  },
      { dr: 1,  dc: 0  },
      { dr: 1,  dc: 1  },
      { dr: 1,  dc: -1 },
      { dr: 0,  dc: -1 },
      { dr: -1, dc: 0  },
      { dr: -1, dc: 1  },
      { dr: -1, dc: -1 }
    ];

    // టైమర్ మేనేజ్‌మెంట్
    function startTimer() {
      clearInterval(timerInterval);
      secondsElapsed = 0;
      timerEl.textContent = "00:00";
      timerInterval = setInterval(() => {
        secondsElapsed++;
        const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
        const secs = String(secondsElapsed % 60).padStart(2, '0');
        timerEl.textContent = `${mins}:${secs}`;
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timerInterval);
    }

    // రాండమ్ పదాలను గ్రిడ్‌లో సెట్ చేయడం
    function pickRandomWords() {
      const shuffled = [...MASTER_WORDS].sort(() => 0.5 - Math.random());
      activeWords = shuffled.slice(0, WORDS_COUNT);
    }

    function placeWords() {
      grid = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(''));

      activeWords.forEach(word => {
        let placed = false;
        let attempts = 0;

        while (!placed && attempts < 400) {
          attempts++;
          const dir = DIRECTIONS[Math.floor(Math.random() * DIRECTIONS.length)];
          const r = Math.floor(Math.random() * GRID_SIZE);
          const c = Math.floor(Math.random() * GRID_SIZE);

          const endR = r + dir.dr * (word.length - 1);
          const endC = c + dir.dc * (word.length - 1);

          if (endR >= 0 && endR < GRID_SIZE && endC >= 0 && endC < GRID_SIZE) {
            let canPlace = true;
            for (let i = 0; i < word.length; i++) {
              const curR = r + dir.dr * i;
              const curC = c + dir.dc * i;
              if (grid[curR][curC] !== '' && grid[curR][curC] !== word[i]) {
                canPlace = false;
                break;
              }
            }

            if (canPlace) {
              for (let i = 0; i < word.length; i++) {
                grid[r + dir.dr * i][c + dir.dc * i] = word[i];
              }
              placed = true;
            }
          }
        }
      });

      const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          if (grid[r][c] === '') {
            grid[r][c] = letters[Math.floor(Math.random() * letters.length)];
          }
        }
      }
    }

    function renderUI() {
      gridEl.innerHTML = '';
      wordListEl.innerHTML = '';

      activeWords.forEach(w => {
        const span = document.createElement("span");
        span.id = `word-${w}`;
        span.textContent = w;
        wordListEl.appendChild(span);
      });

      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          const cell = document.createElement("div");
          cell.className = "cell";
          cell.textContent = grid[r][c];
          cell.dataset.r = r;
          cell.dataset.c = c;
          gridEl.appendChild(cell);
        }
      }
    }

    function resetGame() {
      winModal.style.display = "none";
      foundWords.clear();
      selectedCells = [];
      isSelecting = false;
      startCell = null;
      pickRandomWords();
      placeWords();
      renderUI();
      startTimer();
    }

    resetBtn.addEventListener("click", resetGame);
    playAgainBtn.addEventListener("click", resetGame);

    function getCell(r, c) {
      return document.querySelector(`.cell[data-r='${r}'][data-c='${c}']`);
    }

    function getCellFromPoint(x, y) {
      const el = document.elementFromPoint(x, y);
      return el && el.classList.contains("cell") ? el : null;
    }

    // సెలెక్షన్ లాజిక్
    function startSelection(cell) {
      if (!cell) return;
      isSelecting = true;
      startCell = cell;
      highlightLine(cell);
    }

    function updateSelection(cell) {
      if (!isSelecting || !cell || !startCell) return;
      highlightLine(cell);
    }

    function highlightLine(endCell) {
      selectedCells.forEach(c => c.classList.remove("selected"));
      selectedCells = [];

      const r1 = parseInt(startCell.dataset.r);
      const c1 = parseInt(startCell.dataset.c);
      const r2 = parseInt(endCell.dataset.r);
      const c2 = parseInt(endCell.dataset.c);

      const dr = r2 - r1;
      const dc = c2 - c1;

      const isHorizontal = dr === 0 && dc !== 0;
      const isVertical = dc === 0 && dr !== 0;
      const isDiagonal = Math.abs(dr) === Math.abs(dc) && dr !== 0;

      if (r1 === r2 && c1 === c2) {
        selectedCells = [startCell];
      } else if (isHorizontal || isVertical || isDiagonal) {
        const stepR = dr === 0 ? 0 : dr / Math.abs(dr);
        const stepC = dc === 0 ? 0 : dc / Math.abs(dc);
        const steps = Math.max(Math.abs(dr), Math.abs(dc));

        for (let i = 0; i <= steps; i++) {
          const curCell = getCell(r1 + stepR * i, c1 + stepC * i);
          if (curCell) selectedCells.push(curCell);
        }
      } else {
        selectedCells = [startCell];
      }

      selectedCells.forEach(c => c.classList.add("selected"));
    }

    function endSelection() {
      if (!isSelecting) return;
      isSelecting = false;

      const currentWord = selectedCells.map(c => c.textContent).join("");
      const reversedWord = selectedCells.map(c => c.textContent).reverse().join("");

      const matched = activeWords.find(w => w === currentWord || w === reversedWord);

      if (matched && !foundWords.has(matched)) {
        foundWords.add(matched);
        selectedCells.forEach(c => {
          c.classList.remove("selected");
          c.classList.add("found");
        });
        document.getElementById(`word-${matched}`).classList.add("found");

        // గేమ్ గెలిచారా లేదా చెక్ చేయడం
        if (foundWords.size === activeWords.length) {
          stopTimer();
          setTimeout(() => {
            winMessage.textContent = `మీరు ${timerEl.textContent} సమయంలో అన్ని పదాలను కనుగొన్నారు!`;
            winModal.style.display = "flex";
          }, 300);
        }
      } else {
        selectedCells.forEach(c => c.classList.remove("selected"));
      }

      selectedCells = [];
      startCell = null;
    }

    // టచ్ ఈవెంట్‌లు
    gridEl.addEventListener("touchstart", (e) => {
      const t = e.touches[0];
      startSelection(getCellFromPoint(t.clientX, t.clientY));
    });

    window.addEventListener("touchmove", (e) => {
      if (!isSelecting) return;
      const t = e.touches[0];
      updateSelection(getCellFromPoint(t.clientX, t.clientY));
    });

    window.addEventListener("touchend", endSelection);

    // మౌస్ ఈవెంట్‌లు
    gridEl.addEventListener("mousedown", (e) => startSelection(e.target));
    gridEl.addEventListener("mousemove", (e) => {
      if (isSelecting) updateSelection(e.target);
    });
    window.addEventListener("mouseup", endSelection);

    // ఆట ప్రారంభం
    resetGame();
  </script>
</body>
</html>
