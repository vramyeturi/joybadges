<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>10x10 Word Search Puzzle</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: #121212;
      color: #ffffff;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      margin: 0;
      padding: 16px 10px;
      min-height: 100vh;
      box-sizing: border-box;
    }

    h2 {
      margin: 0 0 8px 0;
      color: #f1f2f6;
      letter-spacing: 1px;
    }

    /* Scoreboard & Setup Info Bar */
    .status-panel {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .badge {
      background: #1e1e24;
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid #333;
      font-size: 13px;
      font-weight: 600;
    }

    .series-badge { color: #f39c12; }
    .timer-badge { color: #00d2d3; }
    .timer-badge.warning { color: #e74c3c; animation: blink 1s infinite; }

    @keyframes blink {
      50% { opacity: 0.5; }
    }

    .reset-btn {
      background-color: #ff4757;
      color: white;
      border: none;
      padding: 7px 15px;
      font-size: 13px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(255, 71, 87, 0.3);
      transition: background 0.2s, transform 0.1s;
    }
    .reset-btn:active { transform: scale(0.95); }

    /* Word Targets List */
    .word-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 16px;
      max-width: 360px;
    }
    .word-list span {
      padding: 4px 9px;
      background: #23272a;
      border: 1px solid #3a3f47;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      color: #c8d6e5;
      transition: all 0.2s ease;
    }
    .word-list span.found {
      text-decoration: line-through;
      background: #10ac84;
      border-color: #10ac84;
      color: #ffffff;
      transform: scale(0.96);
    }

    /* Outer Container Padding */
    .grid-container {
      background: #1e1e24;
      padding: 16px;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      border: 1px solid #2f3542;
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(10, 30px);
      grid-template-rows: repeat(10, 30px);
      gap: 3px;
    }

    .cell {
      width: 30px;
      height: 30px;
      background: #2f3542;
      color: #f1f2f6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.1s ease;
    }
    .cell.selected {
      background: #ffa502;
      color: #000;
    }
    .cell.found {
      background: #10ac84;
      color: white;
    }

    /* Dialog Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal-box {
      background: #1e1e24;
      padding: 24px;
      border-radius: 12px;
      text-align: center;
      border: 1px solid #3a3f47;
      box-shadow: 0 10px 25px rgba(0,0,0,0.8);
      max-width: 300px;
      width: 85%;
    }
    .modal-box h3 { margin: 0 0 10px 0; font-size: 22px; }
    .modal-box p { margin: 0 0 18px 0; color: #c8d6e5; font-size: 14px; line-height: 1.4; }
    .modal-btn {
      background: #10ac84;
      color: white;
      border: none;
      padding: 9px 20px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <h2>Word Search (10x10)</h2>

  <div class="status-panel">
    <!-- Series info: Best of ?, Score -->
    <div class="badge series-badge" id="seriesTracker">Best of 3: 0 / 2 Wins</div>
    <!-- Countdown Timer: ? Minutes -->
    <div class="badge timer-badge" id="timerBox">⏱️ Time Left: <span id="timer">02:00</span></div>
    <button class="reset-btn" id="resetBtn">🔄 Restart Round</button>
  </div>

  <div class="word-list" id="wordList"></div>

  <div class="grid-container">
    <div id="grid"></div>
  </div>

  <!-- End of Round / Series Modal -->
  <div class="modal-overlay" id="resultModal">
    <div class="modal-box">
      <h3 id="modalTitle">Round Finished</h3>
      <p id="modalMessage"></p>
      <button class="modal-btn" id="modalActionBtn">Next Round</button>
    </div>
  </div>

  <script>
    // --- Configuration Settings ---
    const GRID_SIZE = 10;
    const TIME_LIMIT_MINUTES = 2; // Set game duration (? Minutes)
    const BEST_OF_SERIES = 3;     // Set series length (Best of ?)
    const WORDS_COUNT = 5;        // Number of target words placed per round
    
    // Target word bank (Words of varying length: 3 to 9 characters)
    const MASTER_WORDS = [
      "CAT", "SUN", "MOON", "MARS",
      "APPLE", "TIGER", "SOLAR", "ROBOT", "EARTH", 
      "PLANET", "ROCKET", "GALAXY", "STREAM", 
      "CRICKET", "NETWORK", "COMPASS", "UNIVERSE"
    ];

    // --- State Variables ---
    const winsNeeded = Math.floor(BEST_OF_SERIES / 2) + 1;
    let roundWins = 0;
    let roundLosses = 0;
    let currentRound = 1;

    let activeWords = [];
    let grid = [];
    let isSelecting = false;
    let startCell = null;
    let selectedCells = [];
    const foundWords = new Set();

    let timerInterval = null;
    let totalSecondsLeft = TIME_LIMIT_MINUTES * 60;
    let isGameOver = false;

    // --- DOM Elements ---
    const gridEl = document.getElementById("grid");
    const wordListEl = document.getElementById("wordList");
    const resetBtn = document.getElementById("resetBtn");
    const timerEl = document.getElementById("timer");
    const timerBox = document.getElementById("timerBox");
    const seriesTrackerEl = document.getElementById("seriesTracker");
    const resultModal = document.getElementById("resultModal");
    const modalTitle = document.getElementById("modalTitle");
    const modalMessage = document.getElementById("modalMessage");
    const modalActionBtn = document.getElementById("modalActionBtn");

    // 8 Valid Search Directions: Horizontal, Vertical, Diagonal
    const DIRECTIONS = [
      { dr: 0,  dc: 1  }, // Right
      { dr: 1,  dc: 0  }, // Down
      { dr: 1,  dc: 1  }, // Down-Right
      { dr: 1,  dc: -1 }, // Down-Left
      { dr: 0,  dc: -1 }, // Left
      { dr: -1, dc: 0  }, // Up
      { dr: -1, dc: 1  }, // Up-Right
      { dr: -1, dc: -1 }  // Up-Left
    ];

    // --- Timer Handling ---
    function updateTimerDisplay() {
      const mins = String(Math.floor(totalSecondsLeft / 60)).padStart(2, '0');
      const secs = String(totalSecondsLeft % 60).padStart(2, '0');
      timerEl.textContent = `${mins}:${secs}`;

      // Visual warning when under 30 seconds
      if (totalSecondsLeft <= 30) {
        timerBox.classList.add("warning");
      } else {
        timerBox.classList.remove("warning");
      }
    }

    function startCountdownTimer() {
      clearInterval(timerInterval);
      totalSecondsLeft = TIME_LIMIT_MINUTES * 60;
      updateTimerDisplay();

      timerInterval = setInterval(() => {
        if (totalSecondsLeft > 0) {
          totalSecondsLeft--;
          updateTimerDisplay();
        } else {
          handleTimeExpired();
        }
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timerInterval);
    }

    // --- Game Logic ---
    function updateScoreboard() {
      seriesTrackerEl.textContent = `Best of ${BEST_OF_SERIES} (Round ${currentRound}): ${roundWins}W - ${roundLosses}L`;
    }

    function pickRandomWords() {
      // Filter words fitting inside the 10x10 bounds, then shuffle
      const eligible = MASTER_WORDS.filter(w => w.length <= GRID_SIZE);
      const shuffled = [...eligible].sort(() => 0.5 - Math.random());
      activeWords = shuffled.slice(0, WORDS_COUNT);
    }

    function placeWords() {
      grid = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(''));

      activeWords.forEach(word => {
        let placed = false;
        let attempts = 0;

        while (!placed && attempts < 400) {
          attempts++;
          const dir = DIRECTIONS[Math.floor(Math.random() * DIRECTIONS.length)];
          const r = Math.floor(Math.random() * GRID_SIZE);
          const c = Math.floor(Math.random() * GRID_SIZE);

          const endR = r + dir.dr * (word.length - 1);
          const endC = c + dir.dc * (word.length - 1);

          if (endR >= 0 && endR < GRID_SIZE && endC >= 0 && endC < GRID_SIZE) {
            let canPlace = true;
            for (let i = 0; i < word.length; i++) {
              const curR = r + dir.dr * i;
              const curC = c + dir.dc * i;
              if (grid[curR][curC] !== '' && grid[curR][curC] !== word[i]) {
                canPlace = false;
                break;
              }
            }

            if (canPlace) {
              for (let i = 0; i < word.length; i++) {
                grid[r + dir.dr * i][c + dir.dc * i] = word[i];
              }
              placed = true;
            }
          }
        }
      });

      // Fill remaining gaps with random letters
      const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          if (grid[r][c] === '') {
            grid[r][c] = letters[Math.floor(Math.random() * letters.length)];
          }
        }
      }
    }

    function renderUI() {
      gridEl.innerHTML = '';
      wordListEl.innerHTML = '';

      activeWords.forEach(w => {
        const span = document.createElement("span");
        span.id = `word-${w}`;
        span.textContent = w;
        wordListEl.appendChild(span);
      });

      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          const cell = document.createElement("div");
          cell.className = "cell";
          cell.textContent = grid[r][c];
          cell.dataset.r = r;
          cell.dataset.c = c;
          gridEl.appendChild(cell);
        }
      }
    }

    function startNewRound() {
      resultModal.style.display = "none";
      isGameOver = false;
      foundWords.clear();
      selectedCells = [];
      isSelecting = false;
      startCell = null;

      updateScoreboard();
      pickRandomWords();
      placeWords();
      renderUI();
      startCountdownTimer();
    }

    function resetEntireSeries() {
      roundWins = 0;
      roundLosses = 0;
      currentRound = 1;
      startNewRound();
    }

    // --- Selection Vector Math ---
    function getCell(r, c) {
      return document.querySelector(`.cell[data-r='${r}'][data-c='${c}']`);
    }

    function getCellFromPoint(x, y) {
      const el = document.elementFromPoint(x, y);
      return el && el.classList.contains("cell") ? el : null;
    }

    function startSelection(cell) {
      if (!cell || isGameOver) return;
      isSelecting = true;
      startCell = cell;
      highlightLine(cell);
    }

    function updateSelection(cell) {
      if (!isSelecting || !cell || !startCell || isGameOver) return;
      highlightLine(cell);
    }

    function highlightLine(endCell) {
      selectedCells.forEach(c => c.classList.remove("selected"));
      selectedCells = [];

      const r1 = parseInt(startCell.dataset.r);
      const c1 = parseInt(startCell.dataset.c);
      const r2 = parseInt(endCell.dataset.r);
      const c2 = parseInt(endCell.dataset.c);

      const dr = r2 - r1;
      const dc = c2 - c1;

      const isHorizontal = dr === 0 && dc !== 0;
      const isVertical = dc === 0 && dr !== 0;
      const isDiagonal = Math.abs(dr) === Math.abs(dc) && dr !== 0;

      if (r1 === r2 && c1 === c2) {
        selectedCells = [startCell];
      } else if (isHorizontal || isVertical || isDiagonal) {
        const stepR = dr === 0 ? 0 : dr / Math.abs(dr);
        const stepC = dc === 0 ? 0 : dc / Math.abs(dc);
        const steps = Math.max(Math.abs(dr), Math.abs(dc));

        for (let i = 0; i <= steps; i++) {
          const curCell = getCell(r1 + stepR * i, c1 + stepC * i);
          if (curCell) selectedCells.push(curCell);
        }
      } else {
        selectedCells = [startCell];
      }

      selectedCells.forEach(c => c.classList.add("selected"));
    }

    function endSelection() {
      if (!isSelecting || isGameOver) return;
      isSelecting = false;

      const currentWord = selectedCells.map(c => c.textContent).join("");
      const reversedWord = selectedCells.map(c => c.textContent).reverse().join("");

      const matched = activeWords.find(w => w === currentWord || w === reversedWord);

      if (matched && !foundWords.has(matched)) {
        foundWords.add(matched);
        selectedCells.forEach(c => {
          c.classList.remove("selected");
          c.classList.add("found");
        });
        document.getElementById(`word-${matched}`).classList.add("found");

        // Check if all targets found in this round
        if (foundWords.size === activeWords.length) {
          handleRoundWon();
        }
      } else {
        selectedCells.forEach(c => c.classList.remove("selected"));
      }

      selectedCells = [];
      startCell = null;
    }

    // --- Win / Loss Event Handlers ---
    function handleRoundWon() {
      stopTimer();
      isGameOver = true;
      roundWins++;

      setTimeout(() => {
        if (roundWins === winsNeeded) {
          // Player won the series
          modalTitle.textContent = "🏆 Series Champion!";
          modalMessage.textContent = `You won ${roundWins} out of ${BEST_OF_SERIES} rounds!`;
          modalActionBtn.textContent = "Play New Series";
          modalActionBtn.onclick = resetEntireSeries;
        } else {
          modalTitle.textContent = "🎉 Round Cleared!";
          modalMessage.textContent = `You found all words with ${timerEl.textContent} remaining.`;
          modalActionBtn.textContent = "Next Round";
          modalActionBtn.onclick = () => { currentRound++; startNewRound(); };
        }
        resultModal.style.display = "flex";
      }, 300);
    }

    function handleTimeExpired() {
      stopTimer();
      isGameOver = true;
      roundLosses++;

      setTimeout(() => {
        if (roundLosses === winsNeeded) {
          // Series lost
          modalTitle.textContent = "❌ Series Over";
          modalMessage.textContent = `Time ran out! You reached ${roundLosses} losses. Better luck next time!`;
          modalActionBtn.textContent = "Try Series Again";
          modalActionBtn.onclick = resetEntireSeries;
        } else {
          modalTitle.textContent = "⏰ Time's Up!";
          modalMessage.textContent = `You ran out of time in Round ${currentRound}.`;
          modalActionBtn.textContent = "Next Round";
          modalActionBtn.onclick = () => { currentRound++; startNewRound(); };
        }
        resultModal.style.display = "flex";
      }, 300);
    }

    // Touch & Mouse Events
    gridEl.addEventListener("touchstart", (e) => {
      const t = e.touches[0];
      startSelection(getCellFromPoint(t.clientX, t.clientY));
    });

    window.addEventListener("touchmove", (e) => {
      if (!isSelecting) return;
      const t = e.touches[0];
      updateSelection(getCellFromPoint(t.clientX, t.clientY));
    });

    window.addEventListener("touchend", endSelection);

    gridEl.addEventListener("mousedown", (e) => startSelection(e.target));
    gridEl.addEventListener("mousemove", (e) => {
      if (isSelecting) updateSelection(e.target);
    });
    window.addEventListener("mouseup", endSelection);

    resetBtn.addEventListener("click", startNewRound);

    // Initialize Game
    resetEntireSeries();
  </script>
</body>
</html>
