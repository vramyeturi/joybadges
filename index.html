<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambola Caller & Ticket Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --primary: #6c5ce7;
            --called-bg: #fff200;
            --called-text: #000000;
            --current-bg: #00b894;
            --current-text: #ffffff;
            --bg-gradient: linear-gradient(135deg, #1e272e 0%, #2f3542 100%);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px;
        }
        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }
        h1 { font-size: clamp(1.4rem, 4vw, 1.8rem); text-align: center; }
        .display-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.15);
        }
        .main-number-box { display: flex; flex-direction: column; align-items: center; }
        .current-number {
            font-size: clamp(3rem, 10vw, 4.5rem);
            font-weight: 800;
            color: #ffeaa7;
            height: clamp(60px, 12vw, 80px);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .current-number.flash { color: #ff7675; transform: scale(1.1); }
        .status-badge { font-size: 0.8rem; color: #a4b0be; text-transform: uppercase; }

        .board-wrapper {
            background: #ffffff;
            padding: clamp(10px, 2.5vw, 18px);
            border-radius: 14px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .board-header {
            color: #2d3436;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 5px;
            border-bottom: 2px solid #dfe6e9;
            padding-bottom: 6px;
        }
        .board-title { font-size: 1.1rem; font-weight: 800; }
        .board-meta { font-size: 0.85rem; font-weight: 600; color: #636e72; display: flex; gap: 12px; }
        .board-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; width: 100%; }
        .board-cell {
            background: #f1f2f6;
            color: #2d3436;
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(1rem, 3.2vw, 1.6rem);
            font-weight: 800;
            border-radius: 6px;
            user-select: none;
        }
        .board-cell.called { background: var(--called-bg) !important; color: var(--called-text) !important; border: 2px solid #e1b12c; }
        .board-cell.last-called { background: var(--current-bg) !important; color: var(--current-text) !important; border: 2px solid #009432; animation: pulse 1s infinite alternate; }
        @keyframes pulse { 0% { transform: scale(0.96); } 100% { transform: scale(1.04); } }

        .controls-wrapper { width: 100%; display: flex; flex-direction: column; gap: 10px; }
        .btn-next {
            width: 100%;
            background-color: var(--primary);
            font-size: 1.25rem;
            font-weight: 700;
            padding: 14px;
            border-radius: 12px;
            border: none;
            color: white;
            cursor: pointer;
        }
        .btn-next:disabled { opacity: 0.5; cursor: not-allowed; }
        .sub-buttons-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; }
        .btn-sub {
            border: none;
            padding: 10px 6px;
            border-radius: 10px;
            font-size: clamp(0.75rem, 2.2vw, 0.9rem);
            font-weight: 600;
            cursor: pointer;
            color: white;
            min-height: 44px;
        }
        .btn-board-dl { background-color: #00b894; }
        .btn-reset { background-color: #d63031; }
        .btn-mute { background-color: #636e72; }
        .btn-mute.active { background-color: #e17055; }
        .btn-ticket-gen { background-color: #0984e3; }
        .btn-ticket-dl { background-color: #00cec9; }
        .btn-ticket-share { background-color: #25D366; }

        .ticket-section { width: 100%; margin-top: 10px; display: flex; flex-direction: column; align-items: center; }
        .ticket-wrapper {
            background: #ffffff;
            padding: clamp(10px, 3vw, 20px);
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
            border-left: 6px solid var(--primary);
            width: 100%;
            max-width: 600px;
        }
        .ticket-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 2px dashed #a29bfe; padding-bottom: 6px; }
        .ticket-title { font-size: 1.2rem; font-weight: 800; color: var(--primary); }
        .ticket-id { font-size: 0.85rem; color: #2d3436; background: #f1f2f6; padding: 4px 8px; border-radius: 8px; font-weight: 700; }
        .ticket-grid { display: grid; grid-template-columns: repeat(9, 1fr); gap: 3px; background-color: #dfe6e9; padding: 4px; border-radius: 8px; width: 100%; }
        .ticket-cell {
            background-color: #ffffff;
            width: 100%;
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(0.95rem, 3.2vw, 1.3rem);
            font-weight: 800;
            color: #2d3436;
            border-radius: 4px;
        }
        .ticket-cell.empty { background-color: #f8f9fa; color: transparent; }

        @media (max-width: 500px) {
            .sub-buttons-grid { grid-template-columns: repeat(2, 1fr); }
            .board-grid { gap: 2px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎲 Tambola Caller & Ticket</h1>

        <div class="display-card">
            <div class="main-number-box">
                <span class="status-badge" id="statusText">Next Number</span>
                <div class="current-number" id="currentNumber">--</div>
            </div>
            <div style="text-align: right;">
                <div style="font-size: 0.85rem; color: #a4b0be;">Called Count</div>
                <div style="font-size: 1.4rem; font-weight: 800; color: #55efc4;" id="calledCount">0 / 90</div>
            </div>
        </div>

        <div class="board-wrapper" id="boardWrapper">
            <div class="board-header">
                <div class="board-title">TAMBOLA BOARD</div>
                <div class="board-meta">
                    <span id="playNumber">Play No: 1</span>
                    <span id="liveDateTime">--:--:--</span>
                </div>
            </div>
            <div class="board-grid" id="boardGrid"></div>
        </div>

        <div class="controls-wrapper">
            <button class="btn-next" id="nextBtn" onclick="drawNextNumber()">⚡ NEXT NUMBER</button>

            <div class="sub-buttons-grid">
                <button class="btn-sub btn-board-dl" onclick="downloadBoard()">📥 Board Image</button>
                <button class="btn-sub btn-mute" id="muteBtn" onclick="toggleMute()">🔊 Sound: ON</button>
                <button class="btn-sub btn-reset" onclick="resetGame()">🔄 Reset Game</button>
                <button class="btn-sub btn-ticket-gen" onclick="generateNewTicket()">🎟️ Gen Ticket</button>
                <button class="btn-sub btn-ticket-dl" onclick="downloadTicketImage()">💾 Ticket Image</button>
                <button class="btn-sub btn-ticket-share" onclick="shareTicketLinkWhatsApp()">🔗 Share Link</button>
            </div>
        </div>

        <div class="ticket-section">
            <div id="ticketContainer" style="width: 100%; display: flex; justify-content: center;"></div>
        </div>
    </div>

    <script>
        let availableNumbers = [];
        let calledNumbers = [];
        let isMuted = false;
        let isRolling = false;
        let playCount = 1;
        let currentTicketId = "";
        let currentTicketRawData = []; // 27 సంఖ్యల శ్రేణి (3x9)

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playTickSound() {
            if (isMuted) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.frequency.setValueAtTime(450, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.03);
        }

        function playBellSound() {
            if (isMuted) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            [880, 1760].forEach((freq) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.2);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 1.2);
            });
        }

        function updateDateTime() {
            const now = new Date();
            const dateStr = now.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
            const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById('liveDateTime').innerText = `${dateStr} | ${timeStr}`;
        }
        setInterval(updateDateTime, 1000);
        updateDateTime();

        function initBoard() {
            const grid = document.getElementById('boardGrid');
            grid.innerHTML = '';
            for (let i = 1; i <= 90; i++) {
                const cell = document.createElement('div');
                cell.className = 'board-cell';
                cell.id = `cell-${i}`;
                cell.innerText = i;
                grid.appendChild(cell);
            }
            availableNumbers = Array.from({ length: 90 }, (_, i) => i + 1);
            calledNumbers = [];
            document.getElementById('playNumber').innerText = `Play No: ${playCount}`;
            document.getElementById('calledCount').innerText = `0 / 90`;
        }

        function drawNextNumber() {
            if (isRolling || availableNumbers.length === 0) return;
            isRolling = true;
            document.getElementById('nextBtn').disabled = true;
            const currentNumEl = document.getElementById('currentNumber');
            document.getElementById('statusText').innerText = "Selecting...";
            currentNumEl.classList.add('flash');

            let flashes = 0;
            const flashInterval = setInterval(() => {
                currentNumEl.innerText = availableNumbers[Math.floor(Math.random() * availableNumbers.length)];
                playTickSound();
                flashes++;
                if (flashes >= 18) {
                    clearInterval(flashInterval);
                    finalizeNumber();
                }
            }, 70);
        }

        function finalizeNumber() {
            const randomIndex = Math.floor(Math.random() * availableNumbers.length);
            const pickedNumber = availableNumbers.splice(randomIndex, 1)[0];

            if (calledNumbers.length > 0) {
                const prevCell = document.getElementById(`cell-${calledNumbers[calledNumbers.length - 1]}`);
                if (prevCell) prevCell.className = 'board-cell called';
            }

            calledNumbers.push(pickedNumber);
            const currentNumEl = document.getElementById('currentNumber');
            currentNumEl.classList.remove('flash');
            currentNumEl.innerText = pickedNumber;
            document.getElementById('statusText').innerText = "Current Number";

            const cell = document.getElementById(`cell-${pickedNumber}`);
            if (cell) cell.className = 'board-cell called last-called';

            playBellSound();
            document.getElementById('calledCount').innerText = `${calledNumbers.length} / 90`;
            isRolling = false;
            document.getElementById('nextBtn').disabled = availableNumbers.length === 0;
            if (availableNumbers.length === 0) document.getElementById('statusText').innerText = "Game Over!";
        }

        function toggleMute() {
            isMuted = !isMuted;
            const muteBtn = document.getElementById('muteBtn');
            muteBtn.innerText = isMuted ? "🔇 Sound: OFF" : "🔊 Sound: ON";
            muteBtn.classList.toggle('active', isMuted);
        }

        function resetGame() {
            if (calledNumbers.length > 0 && !confirm("Do You Want to Close the Existing Play and Reset??")) return;
            playCount++;
            document.getElementById('currentNumber').innerText = "--";
            document.getElementById('statusText').innerText = "Next Number";
            document.getElementById('nextBtn').disabled = false;
            initBoard();
        }

        function downloadBoard() {
            const board = document.getElementById('boardWrapper');
            html2canvas(board, { scale: 2 }).then(canvas => {
                const link = document.createElement('a');
                link.download = `Tambola-Board-Play-${playCount}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        /* టిక్కెట్ జనరేషన్ */
        function generateTambolaTicketData() {
            let ticket = Array(3).fill().map(() => Array(9).fill(0));
            let columns = Array(9).fill().map((_, i) => {
                let min = i === 0 ? 1 : i * 10;
                let max = i === 8 ? 90 : (i * 10) + 9;
                let nums = [];
                for (let n = min; n <= max; n++) nums.push(n);
                return nums;
            });

            let colIndices = [0, 1, 2, 3, 4, 5, 6, 7, 8].sort(() => Math.random() - 0.5);
            colIndices.forEach((col, idx) => {
                let row = idx % 3;
                let randIdx = Math.floor(Math.random() * columns[col].length);
                ticket[row][col] = columns[col].splice(randIdx, 1)[0];
            });

            while (ticket.reduce((acc, row) => acc + row.filter(v => v !== 0).length, 0) < 15) {
                let row = Math.floor(Math.random() * 3);
                let col = Math.floor(Math.random() * 9);
                if (ticket[row].filter(v => v !== 0).length < 5 && ticket[row][col] === 0 && columns[col].length > 0) {
                    let randIdx = Math.floor(Math.random() * columns[col].length);
                    ticket[row][col] = columns[col].splice(randIdx, 1)[0];
                }
            }

            for (let c = 0; c < 9; c++) {
                let activeVals = [];
                for (let r = 0; r < 3; r++) {
                    if (ticket[r][c] !== 0) activeVals.push(ticket[r][c]);
                }
                activeVals.sort((a, b) => a - b);
                let aIdx = 0;
                for (let r = 0; r < 3; r++) {
                    if (ticket[r][c] !== 0) ticket[r][c] = activeVals[aIdx++];
                }
            }
            return ticket;
        }

        function renderTicket(ticketData) {
            currentTicketRawData = ticketData.flat(); // 27 నెంబర్ల flat array
            const container = document.getElementById('ticketContainer');
            container.innerHTML = '';

            const wrapper = document.createElement('div');
            wrapper.className = 'ticket-wrapper';
            wrapper.id = 'actualTicket';

            const header = document.createElement('div');
            header.className = 'ticket-header';
           
            const title = document.createElement('div');
            title.className = 'ticket-title';
            title.innerText = 'TAMBOLA TICKET';

            currentTicketId = 'TICK-' + Math.floor(100000 + Math.random() * 900000);
            const idTag = document.createElement('span');
            idTag.className = 'ticket-id';
            idTag.innerText = currentTicketId;

            header.appendChild(title);
            header.appendChild(idTag);
            wrapper.appendChild(header);

            const grid = document.createElement('div');
            grid.className = 'ticket-grid';

            for (let r = 0; r < 3; r++) {
                for (let c = 0; c < 9; c++) {
                    const val = ticketData[r][c];
                    const cell = document.createElement('div');
                    if (val === 0) {
                        cell.className = 'ticket-cell empty';
                        cell.innerHTML = '&nbsp;';
                    } else {
                        cell.className = 'ticket-cell';
                        cell.innerText = val;
                    }
                    grid.appendChild(cell);
                }
            }
            wrapper.appendChild(grid);
            container.appendChild(wrapper);
        }

        function generateNewTicket() {
            renderTicket(generateTambolaTicketData());
        }

        function downloadTicketImage() {
            const ticketElement = document.getElementById('actualTicket');
            if (!ticketElement) return;
            html2canvas(ticketElement, { scale: 2 }).then(canvas => {
                const link = document.createElement('a');
                link.download = `${currentTicketId}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        // 27 నెంబర్ల స్ట్రింగ్ మరియు ప్లే నెంబర్ తో లింక్ వాట్సాప్‌కి పంపడం
        function shareTicketLinkWhatsApp() {
            if (!currentTicketRawData || currentTicketRawData.length !== 27) {
                alert("ముందుగా టిక్కెట్ జెనరేట్ చేయండి!");
                return;
            }

            // 27 సంఖ్యలను కామాలతో కలుపుతున్నాం (e.g. 10,0,23,...)
            const dataString = currentTicketRawData.join(',');
            
            // ప్లేయర్ పేజీ URL తయారీ
            const baseUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1);
            const playerUrl = `${baseUrl}player.html?data=${encodeURIComponent(dataString)}&play=${playCount}&id=${currentTicketId}`;

            const msg = `🎟️ *Tambola Ticket (Play No: ${playCount})*\nTicket ID: ${currentTicketId}\nClick On This Link to Open Your Ticket:\n👉 ${playerUrl}`;
            
            window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`, '_blank');
        }

 window.onload = function() {
            initBoard();
            generateNewTicket();
        };
    </script>
</body>
</html>
